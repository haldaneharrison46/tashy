# IONOS Deploy Now — deployment config for the "tashy" project.
# Schema: https://docs.ionos.space/docs/deployment-configuration/
#
# The PHP site is served from the repository root (DEPLOYMENT_FOLDER: ./).
# These excludes keep dev tooling out of the webroot and, importantly,
# preserve the server-side config/db.php (which holds DB credentials and
# is gitignored, so it is never in the deployment artifact) across
# recurring deploys.

bootstrap:
  excludes:
    - .git
    - .github
    - .deploy-now
    - deploy-ionos.ps1
    - setup-github.ps1
    - deploy.log

recurring:
  excludes:
    - .git
    - .github
    - .deploy-now
    - deploy-ionos.ps1
    - setup-github.ps1
    - deploy.log
    - config/db.php
