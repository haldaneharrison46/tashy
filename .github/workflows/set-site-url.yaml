name: "Maintenance: Set SITE_URL on server"

# One-off maintenance task: corrects the SITE_URL constant in the live
# config/db.php on the .com webspace, using the same SSH key the Deploy Now
# pipeline uses. Read-only inspection by default; pass apply=true to write.
# Never prints the whole config (which holds DB credentials) — only the
# SITE_URL line(s).

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Value to set SITE_URL to"
        required: true
        default: "https://tashykollections.com"
        type: string
      apply:
        description: "Actually write the change (otherwise inspect only)"
        required: true
        default: false
        type: boolean

jobs:
  set-site-url:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.IONOS_SSH_KEY }}" > ~/.ssh/id_ionos
          chmod 600 ~/.ssh/id_ionos

      - name: Inspect / edit SITE_URL over SSH
        env:
          SSH_HOST: access-5020640214.app-ionos.space
          SSH_USER: ${{ secrets.IONOS_DEPLOYMENT_BD4FC25F_E6A4_41D5_A436_924D7AEFB14B_SSH_USERNAME }}
          SITE_URL: ${{ inputs.site_url }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -e
          SSH="ssh -i ~/.ssh/id_ionos -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=25 $SSH_USER@$SSH_HOST"

          echo "== whoami / pwd =="
          $SSH 'whoami; pwd'

          echo "== locate config/db.php =="
          # Resolve the config path: try common locations, fall back to find under the home dir.
          REMOTE_FIND='for p in config/db.php httpdocs/config/db.php /var/www/vhosts/tashykollections.com/httpdocs/config/db.php "$HOME/httpdocs/config/db.php"; do if [ -f "$p" ]; then echo "$p"; exit 0; fi; done; find "$HOME" -maxdepth 4 -path "*/config/db.php" 2>/dev/null | head -1'
          CONFIG=$($SSH "$REMOTE_FIND")
          echo "CONFIG PATH: [$CONFIG]"
          if [ -z "$CONFIG" ]; then echo "::error::Could not locate config/db.php"; exit 1; fi

          echo "== current SITE_URL line (DB creds NOT printed) =="
          $SSH "grep -n \"define('SITE_URL'\" '$CONFIG' || echo 'no SITE_URL line found'"

          if [ "$APPLY" = "true" ]; then
            echo "== applying: SITE_URL -> $SITE_URL =="
            $SSH "cp '$CONFIG' '$CONFIG.bak' && sed -i \"s#^[[:space:]]*define('SITE_URL'.*#define('SITE_URL',   '$SITE_URL');#\" '$CONFIG'"
            echo "== new SITE_URL line =="
            $SSH "grep -n \"define('SITE_URL'\" '$CONFIG'"
            echo "== php -l (syntax check) =="
            $SSH "php -l '$CONFIG' 2>&1 || command -v php8.2 >/dev/null && php8.2 -l '$CONFIG' 2>&1 || echo 'php CLI not available — skipped'"
            echo "== backup saved at: $CONFIG.bak =="
          else
            echo "Inspection only. Re-run with apply=true to write the change."
          fi
