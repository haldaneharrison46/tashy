name: "Maintenance: Provision config on Deploy Now webspace"

# One-off maintenance task for the Deploy Now webspace
# (access-5020640214.app-ionos.space). Read-only by default; with apply=true it
# writes config/db.php (built from .github/deploy/db.php.tpl with secrets +
# SITE_URL substituted in), syntax-checks it, then curls the live default URL to
# confirm the page renders and the DB connects. DB creds come from secrets and
# are masked in logs.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Value to set SITE_URL to"
        required: true
        default: "https://tashykollections.com"
        type: string
      apply:
        description: "Actually write config/db.php (otherwise inspect only)"
        required: true
        default: false
        type: boolean

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: access-5020640214.app-ionos.space
      SSH_USER: ${{ secrets.IONOS_DEPLOYMENT_BD4FC25F_E6A4_41D5_A436_924D7AEFB14B_SSH_USERNAME }}
      SITE_URL: ${{ inputs.site_url }}
      APPLY: ${{ inputs.apply }}
      VERIFY_URL: "https://tashykollections.com"
      TK_DB_HOST: ${{ secrets.TK_DB_HOST }}
      TK_DB_NAME: ${{ secrets.TK_DB_NAME }}
      TK_DB_USER: ${{ secrets.TK_DB_USER }}
      TK_DB_PASS: ${{ secrets.TK_DB_PASS }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.IONOS_SSH_KEY }}" > ~/.ssh/id_ionos
          chmod 600 ~/.ssh/id_ionos

      - name: Provision / verify
        run: |
          set -e
          SSHOPTS="-i $HOME/.ssh/id_ionos -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=25"
          SSH="ssh $SSHOPTS $SSH_USER@$SSH_HOST"

          echo "== PROBE .online webspace (access-5020587559) with deploy key =="
          for U in a1645260 "$SSH_USER"; do
            echo "  trying user=$U:"
            ssh -i $HOME/.ssh/id_ionos -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=20 "$U@access-5020587559.webspace-host.com" 'echo REACHED_5020587559; pwd; ls -d */ 2>/dev/null | head' 2>&1 | head -4
          done

          echo "== whoami / pwd =="
          $SSH 'whoami; pwd'

          echo "== current config/db.php SITE_URL line =="
          $SSH "test -f config/db.php && grep -n \"define('SITE_URL'\" config/db.php || echo '(no config/db.php yet)'"

          echo "== LIVE verify =="
          echo "  config/db.php SITE_URL on THIS (Deploy Now) webspace:"
          $SSH "grep \"define('SITE_URL'\" config/db.php"
          echo "  DNS: A=$(getent ahostsv4 tashykollections.com | awk '{print $1}' | sort -u | tr '\n' ' ') AAAA=$(getent ahostsv6 tashykollections.com | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "  -- http header/redirect chain --"
          curl -sSIL --connect-timeout 20 http://tashykollections.com/ 2>&1 | grep -iE '^HTTP/|^location:|^server:' | head -10
          echo "  -- effective URL after redirects --"
          curl -sSL -o /tmp/p.html -w '  final=%{url_effective} HTTP=%{http_code}\n' --connect-timeout 20 http://tashykollections.com/ 2>/tmp/e || cat /tmp/e
          echo "  canonical: $(grep -oiE '<link rel=\"canonical\" href=\"[^\"]*\"' /tmp/p.html | head -1)"
          echo "  -- https handshake (cert-ignored) --"
          curl -ksSI --connect-timeout 20 https://tashykollections.com/ 2>&1 | grep -iE '^HTTP/|^server:' | head -3 || true
          echo "  -- new webspace staging PHP now? --"
          echo "  staging /index.php -> $(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 20 https://home-5020640214.app-ionos.space/index.php 2>/dev/null)"
          echo "  -- IP comparison (is .com pointing at the Deploy Now webspace yet?) --"
          echo "  tashykollections.com      -> $(getent ahostsv4 tashykollections.com | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "  home-5020640214 (new)     -> $(getent ahostsv4 home-5020640214.app-ionos.space | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "  access-5020640214 (new)   -> $(getent ahostsv4 access-5020640214.app-ionos.space | awk '{print $1}' | sort -u | tr '\n' ' ')"
          echo "  DB error on page?   : $(grep -c 'Database connection failed' /tmp/p.html || true)"
          echo "  stylesheet present? : $(grep -c 'assets/css/style.css' /tmp/p.html || true)"
          echo "  images present?     : $(grep -c 'assets/images/' /tmp/p.html || true)"
          echo "  canonical line      : $(grep -oiE '<link rel=\"canonical\" href=\"[^\"]*\"' /tmp/p.html | head -1)"
          echo "  title line          : $(grep -oiE '<title>[^<]*</title>' /tmp/p.html | head -1)"
          echo "  --- first 12 lines ---"
          head -12 /tmp/p.html

          if [ "$APPLY" != "true" ]; then echo "Verify only (no provisioning)."; exit 0; fi

          echo "== build config from template (creds masked) =="
          cp .github/deploy/db.php.tpl /tmp/db.php
          sed -i "s#__DB_HOST__#${TK_DB_HOST}#; s#__DB_NAME__#${TK_DB_NAME}#; s#__DB_USER__#${TK_DB_USER}#; s#__DB_PASS__#${TK_DB_PASS}#; s#__SITE_URL__#${SITE_URL}#" /tmp/db.php

          echo "== upload to webspace =="
          $SSH 'mkdir -p config'
          scp $SSHOPTS /tmp/db.php "$SSH_USER@$SSH_HOST:config/db.php"
          rm -f /tmp/db.php

          echo "== verify on server: SITE_URL line + php -l =="
          $SSH "grep -n \"define('SITE_URL'\" config/db.php; php -l config/db.php 2>&1 || echo 'php CLI unavailable'"

          echo "== probe staging URL (status + server header) =="
          for path in / /index.php /assets/css/style.css /robots.txt; do
            line=$(curl -sS -o /dev/null -w 'HTTP=%{http_code} type=%{content_type}' "$VERIFY_URL$path" 2>&1 || echo "curl-failed")
            srv=$(curl -sSI "$VERIFY_URL$path" 2>/dev/null | grep -i '^server:' | head -1)
            echo "  $path -> $line  $srv"
          done
          echo "== DB reachability FROM the webspace (the test that matters) =="
          scp $SSHOPTS .github/deploy/dbtest.php "$SSH_USER@$SSH_HOST:dbtest.php"
          $SSH 'P=/usr/bin/php8.2-cli; echo "using $P"; "$P" dbtest.php 2>&1; echo "--- exit=$? ---"; rm -f dbtest.php'
