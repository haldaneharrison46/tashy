name: "Maintenance: Provision config / set SITE_URL on Deploy Now webspace"

# One-off maintenance task for the Deploy Now webspace
# (access-5020640214.app-ionos.space). Read-only by default; with apply=true it
# ensures config/db.php exists (created from repo secrets, SITE_URL from input,
# or its SITE_URL line updated if already present), syntax-checks it, then
# curls the live default URL to confirm the page renders and the DB connects.
# DB credentials come from secrets and are masked in logs.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Value to set SITE_URL to"
        required: true
        default: "https://tashykollections.com"
        type: string
      apply:
        description: "Actually write config/db.php (otherwise inspect only)"
        required: true
        default: false
        type: boolean

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: access-5020640214.app-ionos.space
      SSH_USER: ${{ secrets.IONOS_DEPLOYMENT_BD4FC25F_E6A4_41D5_A436_924D7AEFB14B_SSH_USERNAME }}
      SITE_URL: ${{ inputs.site_url }}
      APPLY: ${{ inputs.apply }}
      VERIFY_URL: "https://home-5020640214.app-ionos.space"
      TK_DB_HOST: ${{ secrets.TK_DB_HOST }}
      TK_DB_NAME: ${{ secrets.TK_DB_NAME }}
      TK_DB_USER: ${{ secrets.TK_DB_USER }}
      TK_DB_PASS: ${{ secrets.TK_DB_PASS }}
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.IONOS_SSH_KEY }}" > ~/.ssh/id_ionos
          chmod 600 ~/.ssh/id_ionos

      - name: Provision / verify
        run: |
          set -e
          SSHOPTS="-i ~/.ssh/id_ionos -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=25"
          SSH="ssh $SSHOPTS $SSH_USER@$SSH_HOST"

          echo "== whoami / pwd =="
          $SSH 'whoami; pwd'

          echo "== current state of config/db.php (SITE_URL line only) =="
          $SSH "test -f config/db.php && grep -n \"define('SITE_URL'\" config/db.php || echo '(no config/db.php yet)'"

          if [ "$APPLY" != "true" ]; then echo "Inspect only. Re-run with apply=true to write."; exit 0; fi

          echo "== building config/db.php locally (creds masked) =="
          {
            printf "<?php\n"
            printf "define('DB_HOST',    '%s');\n" "$TK_DB_HOST"
            printf "define('DB_NAME',    '%s');\n" "$TK_DB_NAME"
            printf "define('DB_USER',    '%s');\n" "$TK_DB_USER"
            printf "define('DB_PASS',    '%s');\n" "$TK_DB_PASS"
            printf "define('DB_CHARSET', 'utf8mb4');\n"
            printf "define('SITE_NAME',  'Tashy Kollections');\n"
            printf "define('SITE_URL',   '%s');\n" "$SITE_URL"
            printf "define('SITE_EMAIL', 'hello@tashykollections.com');\n"
            printf "define('SITE_ADDRESS', '37 Cornwall Street, Falmouth, Trelawny, Jamaica');\n"
            printf "define('CURRENCY',   'JMD');\n"
            printf "define('CURRENCY_SYMBOL', 'J\$');\n"
            printf "define('TAX_RATE',   0.15);\n"
            printf "define('FREE_SHIPPING_THRESHOLD', 5000);\n"
            cat <<'PHPEOF'
function db(): PDO {
    static $pdo = null;
    if ($pdo === null) {
        $dsn = 'mysql:host=' . DB_HOST . ';dbname=' . DB_NAME . ';charset=' . DB_CHARSET;
        $options = [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION, PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC, PDO::ATTR_EMULATE_PREPARES => false];
        try { $pdo = new PDO($dsn, DB_USER, DB_PASS, $options); }
        catch (PDOException $e) { die(json_encode(['error' => 'Database connection failed.'])); }
    }
    return $pdo;
}
if (session_status() === PHP_SESSION_NONE) { session_start(); }
PHPEOF
          } > /tmp/db.php

          echo "== uploading to webspace (config/db.php) =="
          $SSH 'mkdir -p config'
          scp $SSHOPTS /tmp/db.php "$SSH_USER@$SSH_HOST:config/db.php"
          rm -f /tmp/db.php

          echo "== verify on server: SITE_URL line + php -l =="
          $SSH "grep -n \"define('SITE_URL'\" config/db.php; php -l config/db.php 2>&1 || echo 'php CLI unavailable'"

          echo "== curl the live default URL to confirm render + DB =="
          CODE=$(curl -s -o /tmp/page.html -w '%{http_code}' "$VERIFY_URL/index.php" || echo "000")
          echo "HTTP: $CODE"
          echo "DB error present? : $(grep -c 'Database connection failed' /tmp/page.html || true)"
          echo "stylesheet link?  : $(grep -c 'assets/css/style.css' /tmp/page.html || true)"
          echo "product/hero img? : $(grep -c 'assets/images/' /tmp/page.html || true)"
          echo "--- first 25 lines of rendered HTML ---"
          head -25 /tmp/page.html
